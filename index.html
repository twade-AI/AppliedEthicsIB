/* ── Helper: shuffle array ── */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── Flashcards Tab ── */
function FlashcardsTab() {
  const [cards, setCards] = useState(flashcardsData);
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [mastered, setMastered] = useState(() => {
    try { return JSON.parse(localStorage.getItem('ethics-mastered') || '[]'); } catch { return []; }
  });
  const [filter, setFilter] = useState('all');

  const categories = ['all', ...new Set(flashcardsData.map(c => c.category))];

  const filtered = filter === 'all' ? cards : cards.filter(c => c.category === filter);
  const current = filtered[index] || filtered[0];
  const total = filtered.length;

  useEffect(() => { setIndex(0); setFlipped(false); }, [filter, cards]);

  const handleShuffle = () => { setCards(shuffleArray(cards)); setIndex(0); setFlipped(false); };

  const toggleMastered = (front) => {
    const newMastered = mastered.includes(front) ? mastered.filter(m => m !== front) : [...mastered, front];
    setMastered(newMastered);
    localStorage.setItem('ethics-mastered', JSON.stringify(newMastered));
  };

  const handleKeyDown = useCallback((e) => {
    if (e.key === 'ArrowLeft' && index > 0) { setIndex(i => i - 1); setFlipped(false); }
    if (e.key === 'ArrowRight' && index < total - 1) { setIndex(i => i + 1); setFlipped(false); }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlipped(f => !f); }
  }, [index, total]);

  useEffect(() => { window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown); }, [handleKeyDown]);

  const masteredCount = mastered.length;
  const progress = Math.round((masteredCount / flashcardsData.length) * 100);

  if (!current) return <p className="text-gray-500">No cards match this filter.</p>;

  return (
    <div>
      <h2 className="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Flashcards</h2>
      <p className="text-gray-500 dark:text-gray-400 text-sm mb-4">Use arrow keys to navigate, space/enter to flip. Click the star to mark as mastered.</p>

      {/* Progress bar */}
      <div className="mb-4">
        <div className="flex justify-between text-sm text-gray-600 dark:text-gray-400 mb-1">
          <span>{masteredCount}/{flashcardsData.length} mastered</span>
          <span>{progress}%</span>
        </div>
        <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3">
          <div className="bg-green-500 h-3 rounded-full transition-all duration-500" style={{width: `${progress}%`}}></div>
        </div>
      </div>

      {/* Filter & shuffle */}
      <div className="flex flex-wrap gap-2 mb-4 items-center">
        {categories.map(cat => (
          <button key={cat} onClick={() => setFilter(cat)}
            className={`px-3 py-1 rounded-full text-sm font-medium transition ${filter === cat ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'}`}>
            {cat === 'all' ? 'All' : cat}
          </button>
        ))}
        <button onClick={handleShuffle} className="ml-auto flex items-center gap-1 px-3 py-1 rounded-full text-sm font-medium bg-purple-100 dark:bg-purple-900/50 text-purple-700 dark:text-purple-300 hover:bg-purple-200 dark:hover:bg-purple-900 transition">
          <ShuffleIcon className="w-4 h-4"/> Shuffle
        </button>
      </div>

      {/* Card */}
      <div className="flex justify-center mb-4">
        <div className="flip-card w-full max-w-lg h-64 cursor-pointer" onClick={() => setFlipped(!flipped)} tabIndex={0}>
          <div className={`flip-card-inner relative w-full h-full ${flipped ? 'flipped' : ''}`}>
            <div className="flip-card-front absolute w-full h-full bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl p-6 flex flex-col justify-center items-center text-white shadow-lg">
              <span className="text-xs uppercase tracking-wide opacity-70 mb-2">{current.category}</span>
              <p className="text-lg font-semibold text-center">{current.front}</p>
              <span className="text-xs opacity-50 mt-4">Click or press Space to flip</span>
            </div>
            <div className="flip-card-back absolute w-full h-full bg-gradient-to-br from-green-500 to-teal-600 rounded-2xl p-6 flex flex-col justify-center items-center text-white shadow-lg">
              <p className="text-base text-center leading-relaxed">{current.back}</p>
            </div>
          </div>
        </div>
      </div>

      {/* Controls */}
      <div className="flex items-center justify-center gap-4">
        <button onClick={() => { setIndex(Math.max(0, index - 1)); setFlipped(false); }} disabled={index === 0}
          className="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 disabled:opacity-30 transition"><ArrowLeftIcon className="w-5 h-5 text-gray-700 dark:text-gray-300"/></button>
        <span className="text-sm text-gray-600 dark:text-gray-400 font-medium">{index + 1} / {total}</span>
        <button onClick={() => { setIndex(Math.min(total - 1, index + 1)); setFlipped(false); }} disabled={index === total - 1}
          className="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 disabled:opacity-30 transition"><ArrowRightIcon className="w-5 h-5 text-gray-700 dark:text-gray-300"/></button>
        <button onClick={() => toggleMastered(current.front)}
          className={`ml-4 px-3 py-1 rounded-full text-sm font-medium transition ${mastered.includes(current.front) ? 'bg-green-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300'}`}>
          {mastered.includes(current.front) ? '★ Mastered' : '☆ Mark Mastered'}
        </button>
      </div>
    </div>
  );
}

/* ── Timed Essay Planner Tab ── */
function EssayPlannerTab() {
  const [minutes, setMinutes] = useState(40);
  const [timeLeft, setTimeLeft] = useState(null);
  const [running, setRunning] = useState(false);
  const [plan, setPlan] = useState({ thesis: '', for1: '', for2: '', against1: '', against2: '', eval: '' });
  const intervalRef = useRef(null);

  const startTimer = () => { setTimeLeft(minutes * 60); setRunning(true); };
  const pauseTimer = () => setRunning(false);
  const resetTimer = () => { setRunning(false); setTimeLeft(null); };

  useEffect(() => {
    if (running && timeLeft > 0) {
      intervalRef.current = setInterval(() => setTimeLeft(t => t - 1), 1000);
    } else if (timeLeft === 0) { setRunning(false); }
    return () => clearInterval(intervalRef.current);
  }, [running, timeLeft]);

  const formatTime = (s) => {
    if (s === null) return '--:--';
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
  };

  const timerColor = timeLeft !== null && timeLeft < 300 ? 'text-red-500' : timeLeft !== null && timeLeft < 600 ? 'text-amber-500' : 'text-gray-800 dark:text-gray-100';

  return (
    <div>
      <h2 className="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Timed Essay Planner</h2>
      <p className="text-gray-600 dark:text-gray-400 mb-4">Practise planning under timed conditions. Structure your argument before you write.</p>

      {/* Timer */}
      <Card>
        <div className="text-center">
          <div className={`text-5xl font-mono font-bold mb-4 ${timerColor}`}>{formatTime(timeLeft)}</div>
          <div className="flex justify-center gap-3 mb-4">
            {!running && timeLeft === null && (
              <div className="flex items-center gap-2">
                <label className="text-sm text-gray-600 dark:text-gray-400">Minutes:</label>
                <input type="number" value={minutes} onChange={e => setMinutes(Math.max(1, parseInt(e.target.value) || 1))} min="1" max="120"
                  className="w-16 p-1 border rounded dark:bg-gray-700 dark:border-gray-600 text-center"/>
              </div>
            )}
            {!running && timeLeft === null && <button onClick={startTimer} className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">Start Timer</button>}
            {running && <button onClick={pauseTimer} className="px-4 py-2 bg-amber-500 text-white rounded-lg hover:bg-amber-600 transition font-medium">Pause</button>}
            {!running && timeLeft !== null && timeLeft > 0 && <button onClick={() => setRunning(true)} className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">Resume</button>}
            {timeLeft !== null && <button onClick={resetTimer} className="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition font-medium">Reset</button>}
          </div>
          {timeLeft === 0 && <p className="text-red-600 dark:text-red-400 font-bold text-lg animate-pulse">Time's up! Review your plan below.</p>}
        </div>
      </Card>

      {/* Plan scaffold */}
      <Card title="Essay Plan Scaffold">
        <div className="space-y-4">
          <div>
            <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Thesis / Line of Argument</label>
            <textarea value={plan.thesis} onChange={e => setPlan({...plan, thesis: e.target.value})} rows={2}
              placeholder="What is your main argument? State your position clearly."
              className="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 resize-none focus:ring-2 focus:ring-blue-500 outline-none"/>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            <div>
              <label className="block text-sm font-semibold text-green-700 dark:text-green-400 mb-1">Argument FOR #1</label>
              <textarea value={plan.for1} onChange={e => setPlan({...plan, for1: e.target.value})} rows={3}
                placeholder="Framework + principle + application to case"
                className="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 resize-none focus:ring-2 focus:ring-green-500 outline-none"/>
            </div>
            <div>
              <label className="block text-sm font-semibold text-red-700 dark:text-red-400 mb-1">Argument AGAINST #1</label>
              <textarea value={plan.against1} onChange={e => setPlan({...plan, against1: e.target.value})} rows={3}
                placeholder="Counter-framework + principle + challenge"
                className="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 resize-none focus:ring-2 focus:ring-red-500 outline-none"/>
            </div>
            <div>
              <label className="block text-sm font-semibold text-green-700 dark:text-green-400 mb-1">Argument FOR #2</label>
              <textarea value={plan.for2} onChange={e => setPlan({...plan, for2: e.target.value})} rows={3}

            <div>

    const checks = {
      length: wordCount >= 400,
      frameworks: /utilitarian|kant|deontolog|virtue|natural law|consequential/i.test(text),
      thinkers: /bentham|mill|kant|singer|rawls|nozick|pogge|aristotle|aquinas|friedman|freeman/i.test(text),
      evaluation: /however|on the other hand|nevertheless|conversely|critic|weakness|strength|evaluate|weigh|balance|nuance/i.test(text),
      quotes: /"[^"]{10,}"/i.test(text) || /[""][^""]{10,}[""]/.test(text),
      conclusion: /in conclusion|therefore|ultimately|to conclude|overall|on balance/i.test(text),
      examples: /for example|for instance|case study|such as|e\.g\.|consider the case/i.test(text),
      counterArg: /against this|a .* would argue|critics (of|argue|say)|this can be challenged|objection/i.test(text),
    };
    const score = Object.values(checks).filter(Boolean).length;
    setFeedback({ wordCount, checks, score, total: Object.keys(checks).length });
  };

  const criteriaLabels = {
    length: { label: 'Sufficient length (400+ words)', icon: '📝' },
    frameworks: { label: 'References normative framework(s)', icon: '🏛️' },
    thinkers: { label: 'Names specific thinker(s)', icon: '👤' },
    evaluation: { label: 'Contains evaluative language', icon: '⚖️' },
    quotes: { label: 'Includes direct quotation(s)', icon: '💬' },
    conclusion: { label: 'Has a conclusion', icon: '🎯' },
    examples: { label: 'Uses examples or case studies', icon: '📋' },
    counterArg: { label: 'Includes counter-arguments', icon: '🔄' },
  };

  return (
    <div>
      <h2 className="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Essay Builder & Checker</h2>
      <p className="text-gray-600 dark:text-gray-400 mb-4">Write your essay below and check it against Grade 7 criteria. This checks structure and keywords — not content accuracy.</p>

      <Card>
        <textarea value={essay} onChange={e => setEssay(e.target.value)} rows={16}
          placeholder="Write your essay here. Include: framework references, named thinkers, direct quotes, examples, counter-arguments, evaluative language, and a clear conclusion..."
          className="w-full p-4 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 resize-none focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm leading-relaxed"/>
        <div className="flex justify-between items-center mt-3">
          <span className="text-sm text-gray-500">{essay.trim() ? essay.trim().split(/\s+/).length : 0} words</span>
          <button onClick={checkEssay} className="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">Check My Essay</button>
        </div>
      </Card>

      {feedback && (
        <Card title={`Score: ${feedback.score}/${feedback.total}`} className="fade-in">
          <div className="mb-3">
            <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-4 mb-2">
              <div className={`h-4 rounded-full transition-all duration-500 ${feedback.score >= 7 ? 'bg-green-500' : feedback.score >= 5 ? 'bg-amber-500' : 'bg-red-500'}`}
                style={{width: `${(feedback.score/feedback.total)*100}%`}}></div>
            </div>
            <p className="text-sm text-gray-600 dark:text-gray-400">{feedback.wordCount} words • {feedback.score >= 7 ? 'Excellent structure!' : feedback.score >= 5 ? 'Good start — address the missing criteria.' : 'Keep developing — see what\'s missing below.'}</p>
          </div>
          <div className="space-y-2">
            {Object.entries(feedback.checks).map(([key, passed]) => (
              <div key={key} className={`flex items-center gap-3 p-2 rounded-lg ${passed ? 'bg-green-50 dark:bg-green-900/30' : 'bg-red-50 dark:bg-red-900/30'}`}>
                <span className="text-lg">{passed ? '✅' : '❌'}</span>
                <span className="text-lg">{criteriaLabels[key].icon}</span>
                <span className={`text-sm font-medium ${passed ? 'text-green-700 dark:text-green-400' : 'text-red-700 dark:text-red-400'}`}>{criteriaLabels[key].label}</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

/* ── Autopsy Tab ── */
function AutopsyTab() {
  const [promptIndex, setPromptIndex] = useState(0);
  const [showHint, setShowHint] = useState(false);
  const [response, setResponse] = useState('');
  const prompt = autopsyPrompts[promptIndex];

  return (
    <div>
      <h2 className="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Argument Autopsy</h2>
      <p className="text-gray-600 dark:text-gray-400 mb-6">Dissect claims to reveal hidden assumptions, frameworks, and counter-arguments — a core IB skill.</p>
      <Card>
        <div className="bg-gray-100 dark:bg-gray-700 p-5 rounded-lg mb-4">
          <p className="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-1">Claim to Dissect:</p>
          <p className="text-lg font-bold text-gray-800 dark:text-gray-100 italic">"{prompt.claim}"</p>
        </div>
        <div className="bg-blue-50 dark:bg-blue-900/30 p-4 rounded-lg mb-4">
          <p className="text-blue-800 dark:text-blue-300 text-sm font-medium">{prompt.task}</p>
        </div>
        <textarea value={response} onChange={e => setResponse(e.target.value)} rows={6}
          placeholder="Write your dissection here..."
          className="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 resize-none mb-4 focus:ring-2 focus:ring-blue-500 outline-none"/>
        <div className="flex gap-3 flex-wrap">
          <button onClick={() => { setPromptIndex((promptIndex + 1) % autopsyPrompts.length); setShowHint(false); setResponse(''); }}
            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">Next Claim</button>
          <button onClick={() => setShowHint(!showHint)}
            className="px-4 py-2 bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300 rounded-lg hover:bg-amber-200 dark:hover:bg-amber-900 transition font-medium">{showHint ? 'Hide Hint' : 'Show Hint'}</button>
          <span className="text-sm text-gray-500 dark:text-gray-400 self-center ml-auto">{promptIndex + 1} / {autopsyPrompts.length}</span>
        </div>
        {showHint && (
          <div className="mt-4 bg-amber-50 dark:bg-amber-900/30 p-4 rounded-lg fade-in">
            <p className="text-sm text-amber-700 dark:text-amber-400">
              <strong>Hint:</strong> Think about which ethical framework underpins this claim. What would a thinker from a <em>different</em> framework say? What real-world case could you use to test whether this claim holds up?
            </p>
          </div>
        )}
      </Card>
    </div>
  );
}

/* ── Main App ── */
function App() {
  const [activeTab, setActiveTab] = useState('frameworks');
  const [darkMode, setDarkMode] = useState(() => {
    try { return localStorage.getItem('ethics-dark') === 'true'; } catch { return false; }
  });
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', darkMode);
    localStorage.setItem('ethics-dark', darkMode);
  }, [darkMode]);

  const tabs = [
    { id: 'frameworks', label: 'Frameworks', icon: BookIcon },
    { id: 'biomedical', label: 'Biomedical', icon: HeartIcon },
    { id: 'business', label: 'Business', icon: BriefcaseIcon },
    { id: 'wealth', label: 'Wealth & Poverty', icon: GlobeIcon },
    { id: 'questions', label: 'Practice Exams', icon: PenIcon },
    { id: 'flashcards', label: 'Flashcards', icon: LayersIcon },
    { id: 'quotes', label: 'Quotes Bank', icon: QuoteIcon },
    { id: 'planner', label: 'Essay Planner', icon: ClockIcon },
    { id: 'builder', label: 'Essay Builder', icon: FileIcon },
    { id: 'autopsy', label: 'Argument Autopsy', icon: ScissorsIcon },
  ];

  const renderTab = () => {
    switch (activeTab) {
      case 'frameworks': return <FrameworksTab/>;
      case 'biomedical': return <BiomedicalTab/>;
      case 'business': return <BusinessTab/>;
      case 'wealth': return <WealthTab/>;
      case 'questions': return <QuestionsTab/>;
      case 'flashcards': return <FlashcardsTab/>;
      case 'quotes': return <QuotesTab/>;
      case 'planner': return <EssayPlannerTab/>;
      case 'builder': return <EssayBuilderTab/>;
      case 'autopsy': return <AutopsyTab/>;
      default: return <FrameworksTab/>;
    }
  };

  return (
    <div className="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors">
      {/* Header */}
      <header className="bg-gradient-to-r from-blue-700 via-purple-700 to-indigo-800 text-white shadow-lg">
        <div className="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between">
          <div>
            <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">Applied Ethics: Grade 7 Protocol</h1>
            <p className="text-blue-200 text-sm mt-1">IB Philosophy — Complete Revision Hub</p>
          </div>
          <div className="flex items-center gap-3">
            <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full hover:bg-white/20 transition" title="Toggle dark mode">
              {darkMode ? <SunIcon className="w-5 h-5"/> : <MoonIcon className="w-5 h-5"/>}
            </button>
            <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden p-2 rounded-full hover:bg-white/20 transition">
              {mobileMenuOpen ? <XIcon className="w-5 h-5"/> : <MenuIcon className="w-5 h-5"/>}
            </button>
          </div>
        </div>
      </header>

      {/* Navigation */}
      <nav className={`bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 ${mobileMenuOpen ? '' : 'hidden md:block'}`}>
        <div className="max-w-6xl mx-auto px-4">
          <div className="flex flex-wrap gap-1 py-2">
            {tabs.map(tab => {
              const TabIcon = tab.icon;
              return (
                <button key={tab.id}
                  onClick={() => { setActiveTab(tab.id); setMobileMenuOpen(false); }}
                  className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap
                    ${activeTab === tab.id ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700'}`}>
                  <TabIcon className="w-4 h-4"/>
                  {tab.label}
                </button>
              );
            })}
          </div>
        </div>
      </nav>

      {/* Content */}
      <main className="max-w-4xl mx-auto px-4 py-8">
        {renderTab()}
      </main>

      {/* Footer */}
      <footer className="text-center py-6 text-gray-400 dark:text-gray-600 text-sm">
        Applied Ethics: Grade 7 Protocol — Built for IB Philosophy
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
    </script>
</body>
